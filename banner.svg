<svg width="1600" height="500" viewBox="0 0 1600 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05040a"/>
      <stop offset="45%" stop-color="#0b0f2b"/>
      <stop offset="75%" stop-color="#150a2e"/>
      <stop offset="100%" stop-color="#05040a"/>
    </linearGradient>
    <radialGradient id="glowSpot1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b5cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSpot2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ee6ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2ee6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ef9ff"/>
      <stop offset="45%" stop-color="#8f8bff"/>
      <stop offset="100%" stop-color="#b28dff"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10122a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0a0b1c" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="hexPattern" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <g fill="none" stroke="#3a3d7a" stroke-opacity="0.35" stroke-width="1">
        <polygon points="28,0 56,16 56,48 28,64 0,48 0,16"/>
        <polygon points="28,64 56,80 56,112 28,128 0,112 0,80" transform="translate(0,32)"/>
      </g>
    </pattern>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a2d5c" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#gridPattern)"/>
  <rect width="1600" height="500" fill="url(#hexPattern)"/>
  <ellipse cx="1250" cy="90" rx="420" ry="260" fill="url(#glowSpot1)"/>
  <ellipse cx="220" cy="430" rx="380" ry="220" fill="url(#glowSpot2)"/>

  <!-- Binary rain columns -->
  <g fill="#3ee6ff" opacity="0.16" font-family="Consolas, 'Courier New', monospace" font-size="13">
    <text x="40" y="30">01001101011001010010</text>
    <text x="40" y="50">10110010101101011010</text>
    <text x="40" y="70">01011010010110100101</text>
    <text x="40" y="90">11001010110010101001</text>
    <text x="1400" y="35">10101100101011001010</text>
    <text x="1400" y="55">01101001011010010110</text>
    <text x="1400" y="75">11010010110100101101</text>
    <text x="1400" y="95">01011001010110010101</text>
    <text x="740" y="440">01100101011001010110</text>
    <text x="740" y="460">10101100101011001010</text>
    <text x="740" y="480">01011010010110100101</text>
  </g>

  <!-- Circuit lines -->
  <g fill="none" stroke="#5ad1ff" stroke-opacity="0.45" stroke-width="1.4">
    <path d="M0 250 H90 L110 230 H260 L280 250 H420"/>
    <path d="M1600 130 H1480 L1460 150 H1330 L1310 130 H1180"/>
    <path d="M1600 380 H1520 L1500 400 H1400"/>
    <path d="M0 60 H140 L160 80 H300"/>
  </g>
  <g fill="#5ad1ff" fill-opacity="0.8">
    <circle cx="110" cy="230" r="3"/>
    <circle cx="280" cy="250" r="3"/>
    <circle cx="1460" cy="150" r="3"/>
    <circle cx="1310" cy="130" r="3"/>
    <circle cx="1500" cy="400" r="3"/>
    <circle cx="160" cy="80" r="3"/>
  </g>

  <!-- Digital world map (simplified dot grid silhouette) -->
  <g fill="#6b7bff" opacity="0.22">
    <circle cx="120" cy="150" r="2"/><circle cx="140" cy="145" r="2"/><circle cx="160" cy="160" r="2"/>
    <circle cx="200" cy="140" r="2"/><circle cx="230" cy="150" r="2"/><circle cx="250" cy="165" r="2"/>
    <circle cx="1300" cy="200" r="2"/><circle cx="1320" cy="210" r="2"/><circle cx="1340" cy="195" r="2"/>
    <circle cx="1360" cy="220" r="2"/><circle cx="1390" cy="205" r="2"/>
  </g>

  <!-- Header row: small hacker terminal top-left corner -->
  <g transform="translate(40,30)">
    <rect width="230" height="18" rx="4" fill="#0d0f24" stroke="#3ee6ff" stroke-opacity="0.4"/>
    <circle cx="10" cy="9" r="3" fill="#ff5f57"/>
    <circle cx="22" cy="9" r="3" fill="#febc2e"/>
    <circle cx="34" cy="9" r="3" fill="#28c840"/>
    <text x="50" y="13" font-family="Consolas, monospace" font-size="10" fill="#7ef9ff">root@ikhlass:~$ secure_ops</text>
  </g>

  <!-- Terminal window bottom-left -->
  <g transform="translate(40,340)">
    <rect width="330" height="120" rx="10" fill="url(#panelGrad)" stroke="#6b57ff" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="18" cy="18" r="4" fill="#ff5f57"/>
    <circle cx="34" cy="18" r="4" fill="#febc2e"/>
    <circle cx="50" cy="18" r="4" fill="#28c840"/>
    <text x="18" y="45" font-family="Consolas, monospace" font-size="12" fill="#7ef9ff">$ whoami</text>
    <text x="18" y="63" font-family="Consolas, monospace" font-size="12" fill="#b8c1ff">ikhlass_rohni</text>
    <text x="18" y="83" font-family="Consolas, monospace" font-size="12" fill="#7ef9ff">$ status</text>
    <text x="18" y="101" font-family="Consolas, monospace" font-size="12" fill="#a3ffb0">[+] learning security daily</text>
  </g>

  <!-- Nmap-inspired radar (right side) -->
  <g transform="translate(1420,120)" opacity="0.9">
    <circle r="55" fill="none" stroke="#3ee6ff" stroke-opacity="0.35" stroke-width="1"/>
    <circle r="38" fill="none" stroke="#3ee6ff" stroke-opacity="0.3" stroke-width="1"/>
    <circle r="20" fill="none" stroke="#3ee6ff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="-55" y1="0" x2="55" y2="0" stroke="#3ee6ff" stroke-opacity="0.2"/>
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#3ee6ff" stroke-opacity="0.2"/>
    <path d="M0 0 L55 0 A55 55 0 0 1 38 39 Z" fill="#3ee6ff" opacity="0.18"/>
    <circle cx="20" cy="-15" r="2.5" fill="#7ef9ff"/>
    <circle cx="-30" cy="10" r="2.5" fill="#7ef9ff"/>
    <circle cx="-5" cy="35" r="2.5" fill="#7ef9ff"/>
  </g>

  <!-- Wireshark-style packet stream (right lower) -->
  <g transform="translate(1330,300)" font-family="Consolas, monospace" font-size="9" fill="#8fffb0" opacity="0.85">
    <rect x="-10" y="-14" width="270" height="90" rx="6" fill="#0a0c1f" stroke="#2ee6ff" stroke-opacity="0.3"/>
    <text x="0" y="0">TCP 443 &gt; 51322 [SYN,ACK]</text>
    <text x="0" y="16">TLSv1.3 Client Hello</text>
    <text x="0" y="32" fill="#7ef9ff">HTTP/1.1 200 OK</text>
    <text x="0" y="48">len=1420 seq=88213</text>
    <text x="0" y="64" fill="#b28dff">ARP who-has 10.10.14.1</text>
  </g>

  <!-- Central glowing title -->
  <g text-anchor="middle">
    <text x="800" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="82" font-weight="800"
          fill="url(#textGrad)" filter="url(#strongGlow)" letter-spacing="6">IKHLASS ROHNI</text>
    <text x="800" y="235" font-family="'Segoe UI', Arial, sans-serif" font-size="82" font-weight="800"
          fill="none" stroke="#dff7ff" stroke-opacity="0.25" stroke-width="0.6" letter-spacing="6">IKHLASS ROHNI</text>

    <text x="800" y="278" font-family="Consolas, monospace" font-size="18" fill="#9fd8ff" opacity="0.95" letter-spacing="1">
      Computer Science Student  •  Cybersecurity Learner  •  Bug Bounty Enthusiast
    </text>
  </g>

  <!-- Thin divider line under subtitle -->
  <line x1="500" y1="300" x2="1100" y2="300" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Tech icon strip -->
  <g transform="translate(0,0)" font-family="Consolas, monospace" font-size="11" fill="#c9d3ff">
    <!-- Tux (simplified) -->
    <g transform="translate(560,330)">
      <ellipse cx="0" cy="6" rx="13" ry="16" fill="#e8ecff" opacity="0.9"/>
      <ellipse cx="0" cy="10" rx="9" ry="11" fill="#0b0f2b"/>
      <circle cx="-4" cy="-2" r="2" fill="#0b0f2b"/>
      <circle cx="4" cy="-2" r="2" fill="#0b0f2b"/>
      <polygon points="0,2 -3,6 3,6" fill="#ffb703"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">Linux</text>
    </g>
    <!-- Burp Suite inspired -->
    <g transform="translate(640,330)">
      <circle r="14" fill="none" stroke="#ff6b3d" stroke-width="2.5"/>
      <circle r="4" fill="#ff6b3d"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">Burp</text>
    </g>
    <!-- Python -->
    <g transform="translate(720,330)">
      <path d="M-10,-12 h14 a6,6 0 0 1 6,6 v6 h-14 a6,6 0 0 0 -6,6 v6 h-6 v-10 a8,8 0 0 1 8,-8 z" fill="#3ee6ff"/>
      <path d="M10,12 h-14 a6,6 0 0 1 -6,-6 v-6 h14 a6,6 0 0 0 6,-6 v-6 h6 v10 a8,8 0 0 1 -8,8 z" fill="#8f8bff"/>
      <circle cx="-5" cy="-7" r="1.4" fill="#0b0f2b"/>
      <circle cx="5" cy="7" r="1.4" fill="#0b0f2b"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">Python</text>
    </g>
    <!-- Git -->
    <g transform="translate(800,330)">
      <rect x="-2" y="-14" width="4" height="28" fill="#ff6b3d" transform="rotate(45)"/>
      <circle cx="-8" cy="8" r="3" fill="#ff6b3d"/>
      <circle cx="8" cy="-8" r="3" fill="#ff6b3d"/>
      <circle cx="0" cy="0" r="3" fill="#ff6b3d"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">Git</text>
    </g>
    <!-- GitHub -->
    <g transform="translate(880,330)">
      <circle r="13" fill="#c9d3ff"/>
      <path d="M0,-8 a8,8 0 0 0 -2.5,15.6 c0.4,0.1 0.5,-0.2 0.5,-0.4 v-1.5 c-2.3,0.5 -2.8,-1.1 -2.8,-1.1 c-0.4,-1 -0.9,-1.2 -0.9,-1.2 c-0.8,-0.5 0.1,-0.5 0.1,-0.5 c0.8,0.1 1.3,0.9 1.3,0.9 c0.7,1.3 1.9,0.9 2.4,0.7 c0.1,-0.5 0.3,-0.9 0.5,-1.1 c-1.8,-0.2 -3.7,-0.9 -3.7,-4 c0,-0.9 0.3,-1.6 0.8,-2.1 c-0.1,-0.2 -0.4,-1.1 0.1,-2.3 c0,0 0.7,-0.2 2.3,0.8 c0.7,-0.2 1.4,-0.3 2.1,-0.3 c0.7,0 1.4,0.1 2.1,0.3 c1.6,-1 2.3,-0.8 2.3,-0.8 c0.5,1.2 0.2,2.1 0.1,2.3 c0.5,0.5 0.8,1.2 0.8,2.1 c0,3.1 -1.9,3.8 -3.7,4 c0.3,0.3 0.6,0.8 0.6,1.6 v2.4 c0,0.2 0.1,0.5 0.6,0.4 A8,8 0 0 0 0,-8 Z" fill="#0b0f2b"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">GitHub</text>
    </g>
    <!-- VS Code -->
    <g transform="translate(960,330)">
      <path d="M-13,-3 L4,-13 L13,-8 L-2,0 L13,8 L4,13 L-13,3 Z" fill="#3ee6ff" opacity="0.9"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">VS Code</text>
    </g>
    <!-- Wireshark -->
    <g transform="translate(1040,330)">
      <path d="M-12,0 Q-6,-14 0,0 Q6,14 12,0" fill="none" stroke="#8fffb0" stroke-width="2"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">Wireshark</text>
    </g>
    <!-- Nmap -->
    <g transform="translate(1120,330)">
      <circle r="12" fill="none" stroke="#b28dff" stroke-width="2"/>
      <line x1="0" y1="0" x2="9" y2="-8" stroke="#b28dff" stroke-width="2"/>
      <text x="0" y="34" text-anchor="middle" fill="#8fa2ff">Nmap</text>
    </g>
  </g>

  <!-- Corner frame accents -->
  <g stroke="#5ad1ff" stroke-opacity="0.5" stroke-width="2" fill="none">
    <path d="M20 20 H70 M20 20 V70"/>
    <path d="M1580 20 H1530 M1580 20 V70"/>
    <path d="M20 480 H70 M20 480 V430"/>
    <path d="M1580 480 H1530 M1580 480 V430"/>
  </g>
</svg>
